name: Profile integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/validate_profile.py'
      - '.github/workflows/profile-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/validate_profile.py'
      - '.github/workflows/profile-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate profile README and local SVG artwork
        run: python scripts/validate_profile.py
